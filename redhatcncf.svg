<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500" role="img" aria-labelledby="title desc">
  <title id="title">CNCF Landscape — Red Hat edition</title>
  <desc id="desc">Composite banner combining the CNCF Landscape horizontal logo and the Red Hat 2019 logo with a custom title.</desc>
  
  <!-- Background -->
  <rect width="100%" height="100%" fill="#ffffff"/>
  
  <!-- Safe padding -->
  <g transform="translate(40,40)">
    <!-- Logos row -->
    <g id="logos" transform="translate(0,0)">
      <!-- CNCF Landscape logo (external asset) -->
      <image href="https://raw.githubusercontent.com/cncf/artwork/master/other/cncf-landscape/horizontal/color/cncf-landscape-horizontal-color.svg"
             x="0" y="0" height="140" preserveAspectRatio="xMinYMid meet"/>

      <!-- Divider -->
      <line x1="760" y1="0" x2="760" y2="140" stroke="#e5e7eb" stroke-width="2"/>

      <!-- Red Hat 2019 logo (external asset) -->
      <image href="https://upload.wikimedia.org/wikipedia/commons/7/79/Red_Hat_Logo_2019.svg"
             x="800" y="0" height="140" preserveAspectRatio="xMinYMid meet"/>
    </g>

    <!-- Title / Edition label -->
    <g transform="translate(0,220)">
      <text x="0" y="0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#111827">
        CNCF Landscape highlighting Red Hat involvement
      </text>
    </g>

    <!-- Outline frame for export guidance (optional; hide by setting opacity to 0) -->
    <rect x="-20" y="-20" width="1500" height="400" rx="16" ry="16" fill="none" stroke="#f3f4f6" stroke-width="2" opacity="1"/>
  </g>

  <!-- Metadata -->
  <metadata>
    Created: 2025-10-17. This SVG references external trademarked logos owned by their respective rights holders. Usage may be subject to brand guidelines.
  </metadata>
</svg>
